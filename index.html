<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f6f6">
<title>漫画制作進捗</title>
<style>
:root{--bg:#f6f6f6;--card:#fff;--text:#191919;--muted:#777;--border:#ddd;--soft:#e8e8e8;--started:#aaa;--done:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;padding:18px 14px 40px}
h1{margin:0 0 20px;font-size:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:14px}
.label{color:var(--muted);font-size:12px;margin-bottom:7px}
input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:9px;background:white;padding:0 11px;font-size:16px}
.page-buttons{display:flex;gap:7px;flex-wrap:wrap}
button{font:inherit;color:inherit}
.page-button,.nav-button{min-height:42px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:white}
.page-button.active{background:#222;color:white;border-color:#222}
.summary-top,.stage-info,.table-toolbar,.navigation{display:flex;justify-content:space-between;gap:8px}
.summary-top{align-items:flex-end}.summary-title,.section-title{font-weight:700}.section-title{font-size:15px;margin-bottom:12px}
.percentages{margin-top:4px;display:flex;gap:14px;color:var(--muted);font-size:12px}
.complete-pages{font-size:13px;font-weight:700}
.dual-bar{height:11px;background:var(--soft);border-radius:20px;overflow:hidden;position:relative;margin-top:10px}
.started-bar,.done-bar{position:absolute;left:0;top:0;height:100%;border-radius:20px;transition:width .2s}
.started-bar{background:var(--started)}.done-bar{background:var(--done)}
.legend{display:flex;gap:15px;font-size:11px;color:var(--muted);margin-top:8px}
.stage{margin-top:12px}.stage:first-child{margin-top:0}.stage-info{font-size:12px;margin-bottom:5px}.stage-info span:last-child{color:var(--muted)}
.table-head,.page-row{display:grid;grid-template-columns:25px repeat(5,minmax(0,1fr));gap:3px;align-items:center}
.table-head{margin-bottom:5px}.head{color:var(--muted);font-size:9px;line-height:1.15;text-align:center}
.page-number{text-align:center;color:var(--muted);font-size:11px}.page-row{margin-bottom:4px}
.progress-cell{height:39px;padding:0;border:1px solid var(--border);border-radius:6px;background:white;font-size:15px;font-weight:700}
.progress-cell.state1{background:var(--started)}.progress-cell.state2{background:#222;color:white;border-color:#222}
.table-toolbar{align-items:center;margin-bottom:10px}.range,.nav-page{color:var(--muted);font-size:12px}
.navigation{align-items:center;margin-top:12px}.nav-button:disabled{opacity:.3}.saved{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.backup-button{min-height:44px;border:1px solid var(--border);border-radius:9px;background:white;font-weight:700}
.backup-note{margin-top:9px;color:var(--muted);font-size:11px;line-height:1.5}
.history-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.history-stat{background:var(--bg);border-radius:9px;padding:10px 6px;text-align:center}
.history-stat b{display:block;font-size:17px;margin-top:3px}
.history-stat span{font-size:10px;color:var(--muted)}
.history-chart{height:130px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid var(--border);padding:0 3px;margin-top:8px}
.history-day{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.history-value{font-size:10px;font-weight:700}
.history-bar{width:70%;max-width:28px;background:#222;border-radius:5px 5px 0 0;min-height:2px}
.history-label{font-size:9px;color:var(--muted);height:15px}
.forecast{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:13px;border-top:1px solid var(--border)}
.forecast small{color:var(--muted);display:block;margin-top:3px}
.forecast-date{text-align:right;font-size:17px;font-weight:800}
.page-range{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.page-range>div{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}.page-range input{width:100%;box-sizing:border-box}.page-range b{font-size:14px;color:var(--muted)}@media(max-width:360px){.app{padding-left:9px;padding-right:9px}.table-head,.page-row{grid-template-columns:22px repeat(5,minmax(0,1fr));gap:2px}.progress-cell{height:36px}.head{font-size:8px}}

.page-number{cursor:pointer;position:relative;user-select:none}
.page-number.note-marked{font-weight:800}
.note-badge{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;vertical-align:middle;background:#555}
.sticky-modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:999}
.sticky-modal.open{display:flex}
.sticky-sheet{width:min(520px,100%);background:#fff;border-radius:18px 18px 0 0;padding:18px 14px 24px;box-sizing:border-box}
.sticky-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sticky-head h2{margin:0;font-size:18px}.sticky-close{border:0;background:transparent;font-size:24px}
.sticky-sheet textarea{width:100%;min-height:110px;box-sizing:border-box;border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit}
.color-picks{display:flex;gap:11px;margin:10px 0 16px}
.color-pick{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px #bbb}
.color-pick.selected{border-color:#222;box-shadow:0 0 0 2px #fff,0 0 0 4px #222}
.sticky-save{width:100%;height:44px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:800}
.sticky-actions{display:grid;grid-template-columns:1fr 1.7fr;gap:9px;margin-top:2px}
.sticky-delete{height:44px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#777;font-weight:700}
.sticky-delete:active{background:#f3f3f3}

/* Smooth swipe/page transition */
#pages{
  will-change:transform,opacity;
  transform:translateX(0);
  opacity:1;
}
#pages.page-slide-out-left{
  transform:translateX(-24px);
  opacity:.25;
  transition:transform 130ms ease-in,opacity 130ms ease-in;
}
#pages.page-slide-out-right{
  transform:translateX(24px);
  opacity:.25;
  transition:transform 130ms ease-in,opacity 130ms ease-in;
}
#pages.page-slide-in-from-right{
  animation:pageInRight 220ms cubic-bezier(.22,.61,.36,1);
}
#pages.page-slide-in-from-left{
  animation:pageInLeft 220ms cubic-bezier(.22,.61,.36,1);
}
@keyframes pageInRight{
  from{transform:translateX(28px);opacity:.2}
  to{transform:translateX(0);opacity:1}
}
@keyframes pageInLeft{
  from{transform:translateX(-28px);opacity:.2}
  to{transform:translateX(0);opacity:1}
}


/* Symbol-free progress cells */
.state-swatch{
  display:inline-block;
  width:12px;height:12px;
  border-radius:3px;
  vertical-align:-1px;
  border:1px solid #c9c9c9;
}
.state-swatch.started{background:var(--started);}
.state-swatch.done{background:#171717;border-color:#171717;}

button.state-started{
  background:var(--started) !important;
  color:#222 !important;
}
button.state-done{
  background:#171717 !important;
  color:#fff !important;
  border-color:#171717 !important;
}


/* Multi-project v2 */
.top-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
.top-title h1{margin:0}
.project-list-button,.project-add-button,.project-open-button,.project-cancel-button,.project-create-button{
  min-height:42px;border:1px solid var(--border);border-radius:9px;background:#fff;font-weight:700
}
.project-list-button{padding:0 13px;font-size:12px}
#projectHome{max-width:520px;margin:auto;padding:18px 14px 40px}
.project-home-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.project-home-head h1{margin:0;font-size:22px}
.project-add-button{padding:0 14px;background:#222;color:#fff;border-color:#222}
.project-item{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.project-item-main{display:flex;justify-content:space-between;gap:12px;align-items:center}
.project-item-title{font-weight:800;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-item-meta{font-size:11px;color:var(--muted);margin-top:5px}
.project-open-button{padding:0 14px;flex:none}
.project-empty{background:#fff;border:1px dashed var(--border);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.project-actions{display:flex;justify-content:flex-end;margin-top:9px}
.project-delete-button{border:0;background:transparent;color:#999;font-size:11px;padding:5px}
.project-modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:1100}
.project-modal.open{display:flex}
.project-sheet{width:min(520px,100%);background:#fff;border-radius:18px 18px 0 0;padding:18px 14px 24px}
.project-sheet h2{font-size:18px;margin:0 0 14px}
.project-sheet .page-range{margin-top:10px}
.project-modal-actions{display:grid;grid-template-columns:1fr 1.7fr;gap:9px;margin-top:16px}
.project-cancel-button,.project-create-button{height:44px}
.project-create-button{background:#222;color:#fff;border-color:#222}
.project-backup-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6}


/* Memo list v2 */
.memo-list-button{min-height:42px;padding:0 13px;border:1px solid var(--border);border-radius:9px;background:#fff;font-weight:700;font-size:12px}
.top-actions{display:flex;gap:7px;flex:none}
.memo-modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:1200}
.memo-modal.open{display:flex}
.memo-sheet{width:min(520px,100%);height:78vh;max-height:78vh;box-sizing:border-box;background:#fff;border-radius:18px 18px 0 0;padding:16px 14px 22px;display:flex;flex-direction:column}
.memo-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.memo-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.memo-head h2{font-size:18px;margin:0}
.memo-close{border:0;background:#f1f1f1;border-radius:9px;padding:8px 12px;font-weight:700}
.memo-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.memo-filter{border:1px solid var(--border);background:#fff;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700}
.memo-filter.active{background:#222;color:#fff;border-color:#222}

.memo-item{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.memo-page{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:1px solid rgba(0,0,0,.08)}
.memo-text{font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.memo-jump{border:0;background:#f1f1f1;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:700}
.memo-empty{text-align:center;color:var(--muted);font-size:12px;padding:30px 10px}

</style>
</head>

<script>
const STORAGE_KEY="manga-progress-v1"; // 旧版データ。移行元として残す
const PROJECTS_KEY="manga-progress-projects-v2";
let projectStore={version:2,activeProjectId:null,projects:{}};
let currentProjectId=null;
const stages=["ネーム","ペン","背景","トーン","写植"];
let totalPages=48,startPage=1,currentView=0,progress=createProgress(48);
let history={day:"",baselineDone:0,days:{}};
let pageNotes={};

function createProgress(n){return Array.from({length:n},()=>Array(5).fill(0))}
function localDate(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function doneCount(){return progress.flat().filter(v=>v===2).length}
function weightedCount(){return progress.flat().reduce((sum,v)=>sum+(v===2?1:v===1?0.5:0),0)}
function addDays(dateStr,n){
  const [y,m,d]=dateStr.split("-").map(Number);
  const x=new Date(y,m-1,d); x.setDate(x.getDate()+n); return localDate(x);
}
function normalizeHistory(h){
  const today=localDate();
  if(!h||typeof h!=="object") return {day:today,baselineDone:doneCount(),baselineWeighted:weightedCount(),weightedDays:{},days:{}};
  return {
    day:typeof h.day==="string"&&h.day?h.day:today,
    baselineDone:Number.isFinite(h.baselineDone)?h.baselineDone:doneCount(),
    baselineWeighted:Number.isFinite(h.baselineWeighted)?h.baselineWeighted:weightedCount(),
    weightedDays:h.weightedDays&&typeof h.weightedDays==="object"?h.weightedDays:{},
    days:h.days&&typeof h.days==="object"?h.days:{}
  };
}
function rollHistory(){
  const today=localDate();
  history=normalizeHistory(history);
  if(history.day===today)return;
  // The last known day ends at the current saved state.
  history.days[history.day]=doneCount()-history.baselineDone;
  history.weightedDays[history.day]=weightedCount()-history.baselineWeighted;
  // Missing calendar days had no recorded changes.
  let d=addDays(history.day,1);
  while(d<today){ if(history.days[d]===undefined)history.days[d]=0; d=addDays(d,1); }
  history.day=today;
  history.baselineDone=doneCount();
  history.baselineWeighted=weightedCount();
}
function todayDelta(){rollHistory();return doneCount()-history.baselineDone}
function todayWeightedDelta(){rollHistory();return weightedCount()-history.baselineWeighted}
function makeProjectData(){
  rollHistory();
  return {
    title:document.getElementById("title").value,
    totalPages,startPage,
    progress:progress.map(r=>[...r]),
    history:JSON.parse(JSON.stringify(history)),
    pageNotes:JSON.parse(JSON.stringify(pageNotes))
  };
}
function freshProjectData(title="新しい作品",sp=1,ep=1){
  const n=Math.max(1,Math.min(300,ep-sp+1));
  const p=createProgress(n);
  return {
    title,totalPages:n,startPage:sp,progress:p,
    history:{day:localDate(),baselineDone:0,baselineWeighted:0,weightedDays:{},days:{}},
    pageNotes:{}
  };
}
function newProjectId(){
  return "p_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}
function persistProjectStore(){
  localStorage.setItem(PROJECTS_KEY,JSON.stringify(projectStore));
}
function save(){
  if(!currentProjectId)return;
  projectStore.projects[currentProjectId]=makeProjectData();
  projectStore.activeProjectId=currentProjectId;
  persistProjectStore();
  const m=document.getElementById("saveMessage");
  m.textContent="保存しました ✓";
  clearTimeout(save.timer);
  save.timer=setTimeout(()=>m.textContent="変更は自動保存されます",1200);
}
function normalizeProjectData(s){
  let n=Number.isInteger(s?.totalPages)&&s.totalPages>0?Math.min(300,s.totalPages):48;
  let sp=Number.isInteger(s?.startPage)&&s.startPage>0?s.startPage:1;
  let pg=Array.from({length:n},(_,p)=>Array.from({length:5},(_,i)=>[0,1,2].includes(s?.progress?.[p]?.[i])?s.progress[p][i]:0));
  return {
    title:typeof s?.title==="string"&&s.title?s.title:"無題",
    totalPages:n,startPage:sp,progress:pg,
    history:s?.history&&typeof s.history==="object"?s.history:null,
    pageNotes:s?.pageNotes&&typeof s.pageNotes==="object"?s.pageNotes:{}
  };
}
function migrateLegacyIfNeeded(){
  if(localStorage.getItem(PROJECTS_KEY))return;
  let legacy=null;
  try{ legacy=JSON.parse(localStorage.getItem(STORAGE_KEY)); }catch(e){}
  projectStore={version:2,activeProjectId:null,projects:{}};
  if(legacy&&Array.isArray(legacy.progress)){
    const id=newProjectId();
    const p=normalizeProjectData(legacy);
    // 履歴は作品を開いた時に現在の進捗に合わせて正規化する
    projectStore.projects[id]=p;
    projectStore.activeProjectId=id;
  }
  persistProjectStore();
}
function loadProjectStore(){
  migrateLegacyIfNeeded();
  try{
    const raw=JSON.parse(localStorage.getItem(PROJECTS_KEY));
    if(raw&&raw.projects&&typeof raw.projects==="object"){
      projectStore={version:2,activeProjectId:raw.activeProjectId||null,projects:{}};
      Object.entries(raw.projects).forEach(([id,p])=>{
        if(p&&Array.isArray(p.progress))projectStore.projects[id]=normalizeProjectData(p);
      });
      if(!projectStore.projects[projectStore.activeProjectId])projectStore.activeProjectId=null;
      return;
    }
  }catch(e){}
  projectStore={version:2,activeProjectId:null,projects:{}};
  persistProjectStore();
}
function applyProjectData(s){
  const p=normalizeProjectData(s);
  totalPages=p.totalPages;
  startPage=p.startPage;
  progress=p.progress;
  pageNotes=p.pageNotes;
  document.getElementById("title").value=p.title;
  history=p.history?normalizeHistory(p.history):{day:localDate(),baselineDone:doneCount(),baselineWeighted:weightedCount(),weightedDays:{},days:{}};
  rollHistory();
  currentView=0;
  syncRangeUI();
}
function openProject(id){
  if(!projectStore.projects[id])return;
  currentProjectId=id;
  projectStore.activeProjectId=id;
  applyProjectData(projectStore.projects[id]);
  persistProjectStore();
  document.getElementById("projectHome").style.display="none";
  document.getElementById("editorApp").style.display="";
  render();
}
function showProjectHome(){
  if(currentProjectId)save();
  currentProjectId=null;
  document.getElementById("editorApp").style.display="none";
  document.getElementById("projectHome").style.display="";
  renderProjectList();
}
function projectPercent(p){
  const vals=(p.progress||[]).flat();
  if(!vals.length)return 0;
  return Math.round(vals.filter(v=>v===2).length/vals.length*100);
}
function renderProjectList(){
  const list=document.getElementById("projectList");
  list.innerHTML="";
  const entries=Object.entries(projectStore.projects);
  if(!entries.length){
    list.innerHTML='<div class="project-empty">まだ作品がありません。<br>「＋ 新しい作品」から作成できます。</div>';
    return;
  }
  entries.forEach(([id,p])=>{
    const item=document.createElement("div");
    item.className="project-item";
    const donePages=(p.progress||[]).filter(r=>Array.isArray(r)&&r.every(v=>v===2)).length;
    item.innerHTML=`<div class="project-item-main">
      <div style="min-width:0">
        <div class="project-item-title"></div>
        <div class="project-item-meta">全${p.totalPages}P ・ 完成 ${donePages}P ・ 全工程 ${projectPercent(p)}%</div>
      </div>
      <button class="project-open-button">開く</button>
    </div>
    <div class="project-actions"><button class="project-delete-button">この作品を削除</button></div>`;
    item.querySelector(".project-item-title").textContent=p.title||"無題";
    item.querySelector(".project-open-button").onclick=()=>openProject(id);
    item.querySelector(".project-delete-button").onclick=()=>{
      const name=p.title||"無題";
      if(!confirm(`「${name}」を削除しますか？\nこの操作は元に戻せません。`))return;
      delete projectStore.projects[id];
      if(projectStore.activeProjectId===id)projectStore.activeProjectId=null;
      persistProjectStore();
      renderProjectList();
    };
    list.appendChild(item);
  });
}
function load(){
  loadProjectStore();
}
function makeBackup(){
  if(currentProjectId)projectStore.projects[currentProjectId]=makeProjectData();
  persistProjectStore();
  return {
    app:"manga-progress",
    version:5,
    type:"multi-project",
    exportedAt:new Date().toISOString(),
    projects:projectStore.projects,
    activeProjectId:projectStore.activeProjectId
  };
}
function safeFileName(name){return (name||"漫画制作進捗").replace(/[\/:*?"<>|]/g,"_").trim()||"漫画制作進捗"}
function showBackupStatus(message){
  const box=document.getElementById("backupStatus");box.style.display="block";box.innerHTML=message;
}
function exportBackup(){
  try{
    const data=makeBackup(),date=localDate();
    const fileName=`漫画制作進捗_全作品_backup_${date}.json`;
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=url;link.download=fileName;link.style.display="none";
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    showBackupStatus(`✅ 全作品のバックアップを保存しました。<br><b>${fileName}</b><br><span style="color:var(--muted)">Chromeのダウンロード一覧または端末の「Downloads」を確認してください。</span>`);
  }catch(err){
    showBackupStatus(`❌ バックアップを保存できませんでした。<br><span style="color:var(--muted)">${String(err.message||err)}</span>`);
  }
}
function restoreBackup(data){
  // v5: 全作品バックアップ
  if(data&&data.type==="multi-project"&&data.projects&&typeof data.projects==="object"){
    const restored={};
    Object.entries(data.projects).forEach(([id,p])=>{
      if(p&&Array.isArray(p.progress))restored[id]=normalizeProjectData(p);
    });
    if(!Object.keys(restored).length)throw new Error("invalid");
    projectStore={version:2,activeProjectId:null,projects:restored};
    persistProjectStore();
    showProjectHome();
    return "all";
  }
  // v4以前: 1作品バックアップは新しい作品として追加
  if(!data||!Number.isInteger(data.totalPages)||data.totalPages<1||data.totalPages>300||!Array.isArray(data.progress))throw new Error("invalid");
  const id=newProjectId();
  projectStore.projects[id]=normalizeProjectData(data);
  projectStore.activeProjectId=id;
  persistProjectStore();
  openProject(id);
  return "single";
}
function resizeProgress(n){
  n=Math.max(1,Math.min(300,Number(n)||48));
  const old=progress;
  progress=Array.from({length:n},(_,p)=>old[p]?[...old[p]]:Array(5).fill(0));
  totalPages=n;currentView=Math.min(currentView,Math.max(0,Math.ceil(n/12)-1));
  save();render();
}
function updateSummary(){
  const f=progress.flat(),st=f.filter(v=>v>0).length,dn=f.filter(v=>v===2).length,t=f.length;
  const sp=Math.round(st/t*100),dp=Math.round(dn/t*100);
  startedPercent.textContent=sp+"%";donePercent.textContent=dp+"%";
  mainStarted.style.width=sp+"%";mainDone.style.width=dp+"%";
  completePages.textContent=`完成 ${progress.filter(r=>r.every(v=>v===2)).length} / ${totalPages}P`;
  renderStages();renderHistory();
}
function renderStages(){
  stageProgress.innerHTML="";
  stages.forEach((name,s)=>{
    const st=progress.filter(r=>r[s]>0).length,dn=progress.filter(r=>r[s]===2).length;
    const sp=Math.round(st/totalPages*100),dp=Math.round(dn/totalPages*100);
    const d=document.createElement("div");d.className="stage";
    d.innerHTML=`<div class="stage-info"><span>${name}</span><span>着手 ${sp}% ・ 完成 ${dp}%</span></div><div class="dual-bar"><div class="started-bar" style="width:${sp}%"></div><div class="done-bar" style="width:${dp}%"></div></div>`;
    stageProgress.appendChild(d);
  });
}
function renderHistory(){
  rollHistory();
  const today=localDate(),values=[];
  for(let i=-6;i<=0;i++){
    const date=addDays(today,i);
    values.push({date,value:date===today?todayDelta():Number(history.days[date]||0)});
  }
  const total=values.reduce((a,x)=>a+x.value,0);
  const avg=total/7;
  const td=todayDelta();
  todayWork.textContent=(td>=0?"+":"")+td;
  weekWork.textContent=total;
  avgWork.textContent=avg.toFixed(1);

  const max=Math.max(1,...values.map(x=>Math.abs(x.value)));
  historyChart.innerHTML="";
  values.forEach((x,i)=>{
    const el=document.createElement("div");el.className="history-day";
    const h=x.value===0?2:Math.max(6,Math.round(Math.abs(x.value)/max*72));
    const label=i===6?"今日":`${Number(x.date.slice(5,7))}/${Number(x.date.slice(8,10))}`;
    el.innerHTML=`<div class="history-value">${x.value>0?"+":""}${x.value}</div><div class="history-bar" style="height:${h}px;${x.value<0?"opacity:.35":""}"></div><div class="history-label">${label}</div>`;
    historyChart.appendChild(el);
  });

  const weightedValues=[];
  for(let i=-6;i<=0;i++){
    const date=addDays(today,i);
    weightedValues.push(date===today?todayWeightedDelta():Number(history.weightedDays?.[date]||0));
  }
  const weightedAvg=weightedValues.reduce((a,v)=>a+v,0)/7;
  const remaining=totalPages*5-weightedCount();
  if(remaining<=0){
    forecastDate.innerHTML=`完成！<br><span style="font-size:10px;color:var(--muted);font-weight:400">全工程完了</span>`;
  }else if(weightedAvg>0){
    const days=Math.ceil(remaining/weightedAvg),d=new Date();d.setDate(d.getDate()+days);
    forecastDate.innerHTML=`${d.getMonth()+1}/${d.getDate()}<br><span style="font-size:10px;color:var(--muted);font-weight:400">あと約${days}日</span>`;
  }else{
    forecastDate.innerHTML=`—<br><span style="font-size:10px;color:var(--muted);font-weight:400">データ収集中</span>`;
  }
}

let stickyPage=null,stickyColor="";
function openSticky(page){
  stickyPage=page;
  const n=pageNotes[String(page)]||{text:"",color:""};
  stickyColor=n.color||"";
  document.getElementById("stickyTitle").textContent=`${page}P 付箋`;
  document.getElementById("stickyText").value=n.text||"";
  document.querySelectorAll(".color-pick").forEach(b=>b.classList.toggle("selected",b.dataset.color===stickyColor));
  document.getElementById("stickyModal").classList.add("open");
}
document.querySelectorAll(".color-pick").forEach(b=>b.onclick=()=>{
  stickyColor=b.dataset.color||"";
  document.querySelectorAll(".color-pick").forEach(x=>x.classList.toggle("selected",x===b));
});
document.getElementById("stickyClose").onclick=()=>document.getElementById("stickyModal").classList.remove("open");
document.getElementById("stickyModal").onclick=e=>{if(e.target.id==="stickyModal")e.currentTarget.classList.remove("open")};
document.getElementById("stickyDelete").onclick=()=>{
  if(stickyPage===null)return;
  delete pageNotes[String(stickyPage)];
  stickyColor="";
  document.getElementById("stickyText").value="";
  save();
  document.getElementById("stickyModal").classList.remove("open");
  renderPages();
};
document.getElementById("stickySave").onclick=()=>{
  const text=document.getElementById("stickyText").value.trim();
  if(!stickyColor)stickyColor="#f4dc8a";
  pageNotes[String(stickyPage)]={text,color:stickyColor};
  save();
  document.getElementById("stickyModal").classList.remove("open");
  renderPages();
};

function renderPages(){
  pages.innerHTML="";
  const start=currentView*12,end=Math.min(start+12,totalPages);
  for(let p=start;p<end;p++){
    const row=document.createElement("div");row.className="page-row";
    const num=document.createElement("div");num.className="page-number";
    const actualPage=startPage+p, note=pageNotes[String(actualPage)]||{text:"",color:""};
    num.textContent=actualPage;
    if(note.color)num.style.background=note.color;
    num.onclick=()=>openSticky(actualPage);
    row.appendChild(num);
    for(let s=0;s<5;s++){
      const b=document.createElement("button");b.className="progress-cell state"+progress[p][s];
      b.textContent="";
      b.classList.toggle("state-started",progress[p][s]===1);
      b.classList.toggle("state-done",progress[p][s]===2);
      b.onclick=()=>{progress[p][s]=(progress[p][s]+1)%3;save();renderPages();updateSummary()};
      row.appendChild(b);
    }
    pages.appendChild(row);
  }
  const views=Math.ceil(totalPages/12);
  range.textContent=`${startPage+start}–${startPage+end-1} / 全${totalPages}P`;navPage.textContent=`${currentView+1} / ${views}`;
  prev.disabled=currentView===0;next.disabled=currentView>=views-1;
}
function render(){renderPages();updateSummary()}
prev.onclick=()=>{if(currentView>0){currentView--;renderPages()}};
next.onclick=()=>{if(currentView<Math.ceil(totalPages/12)-1){currentView++;renderPages()}};
function syncRangeUI(){
  startPageInput.value=startPage;
  endPageInput.value=startPage+totalPages-1;
  totalPageLabel.textContent=`全${totalPages}P`;
}
function applyPageRange(){
  const oldStart=startPage;
  let a=Math.max(1,Math.min(999,Number(startPageInput.value)||oldStart));
  let b=Math.max(a,Math.min(999,Number(endPageInput.value)||a));
  const old=progress, oldEnd=oldStart+totalPages-1;
  const newProgress=[];
  for(let page=a;page<=b;page++){
    if(page>=oldStart&&page<=oldEnd) newProgress.push([...old[page-oldStart]]);
    else newProgress.push(Array(5).fill(0));
  }
  startPage=a; totalPages=b-a+1; progress=newProgress; currentView=0;
  syncRangeUI(); save(); render();
}
startPageInput.addEventListener("change",applyPageRange);
endPageInput.addEventListener("change",applyPageRange);
document.getElementById("title").addEventListener("input",save);
document.getElementById("exportBackup").addEventListener("click",exportBackup);
document.getElementById("importBackup").addEventListener("click",()=>document.getElementById("backupFile").click());
document.getElementById("backupFile").addEventListener("change",async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    const kind=restoreBackup(data);
    showBackupStatus(kind==="all"
      ?`✅ 全作品のバックアップを復元しました。<br><b>${file.name}</b>`
      :`✅ 1作品を新しいプロジェクトとして復元しました。<br><b>${file.name}</b>`);
  }catch(err){showBackupStatus("❌ このバックアップファイルは読み込めませんでした。")}
  e.target.value="";
});



// メモ一覧表示中は、背面の12Pスワイプへタッチ操作を伝えない
const memoOverlay=document.getElementById("memoListModal");
["touchstart","touchmove","touchend"].forEach(type=>{
  memoOverlay.addEventListener(type,e=>e.stopPropagation(),{passive:true});
});

let memoListFilter="all";
function renderMemoList(){
  const body=document.getElementById("memoListBody");
  body.innerHTML="";
  const entries=Object.entries(pageNotes||{})
    .map(([key,note])=>{
      const page=Number(key);
      const index=page-startPage;
      return {index,page,note};
    })
    .filter(x=>Number.isInteger(x.page)&&x.index>=0&&x.index<totalPages&&x.note&&typeof x.note==="object")
    .filter(x=>memoListFilter==="all"||x.note.color===memoListFilter)
    .sort((a,b)=>a.page-b.page);
  if(!entries.length){
    body.innerHTML='<div class="memo-empty">該当するメモはありません。</div>';
    return;
  }
  entries.forEach(({index,page,note})=>{
    const row=document.createElement("div");
    row.className="memo-item";
    const pg=document.createElement("div");
    pg.className="memo-page";
    pg.style.background=note.color||"#f4dc8a";
    pg.textContent=page+"P";
    const tx=document.createElement("div");
    tx.className="memo-text";
    tx.textContent=(note.text||"").trim()||"（メモ本文なし）";
    const jump=document.createElement("button");
    jump.className="memo-jump";
    jump.textContent="移動";
    jump.onclick=()=>{
      if(index<0||index>=totalPages)return;
      currentView=Math.floor(index/12);
      document.getElementById("memoListModal").classList.remove("open");
      document.body.style.overflow="";
      render();
      const pages=document.getElementById("pages");
      if(pages)pages.scrollIntoView({behavior:"smooth",block:"start"});
    };
    row.append(pg,tx,jump);
    body.appendChild(row);
  });
}
document.getElementById("memoListButton").onclick=()=>{
  memoListFilter="all";
  document.querySelectorAll(".memo-filter").forEach(b=>b.classList.toggle("active",b.dataset.filter==="all"));
  renderMemoList();
  document.getElementById("memoListModal").classList.add("open");
  document.body.style.overflow="hidden";
};
document.getElementById("closeMemoList").onclick=()=>{
  document.getElementById("memoListModal").classList.remove("open");
  document.body.style.overflow="";
};
document.getElementById("memoListModal").onclick=e=>{
  if(e.target.id==="memoListModal"){
    e.currentTarget.classList.remove("open");
    document.body.style.overflow="";
  }
};
document.querySelectorAll(".memo-filter").forEach(btn=>btn.onclick=()=>{
  memoListFilter=btn.dataset.filter;
  document.querySelectorAll(".memo-filter").forEach(b=>b.classList.toggle("active",b===btn));
  renderMemoList();
});

document.getElementById("backToProjects").onclick=showProjectHome;
document.getElementById("newProjectButton").onclick=()=>{
  document.getElementById("newProjectTitle").value="";
  document.getElementById("newProjectStart").value=1;
  document.getElementById("newProjectEnd").value=1;
  document.getElementById("newProjectTotal").textContent="全1P";
  document.getElementById("projectModal").classList.add("open");

document.getElementById("cancelNewProject").onclick=()=>document.getElementById("projectModal").classList.remove("open");
document.getElementById("projectModal").onclick=e=>{if(e.target.id==="projectModal")e.currentTarget.classList.remove("open")};
function updateNewProjectTotal(){
  let a=Math.max(1,Math.min(999,Number(document.getElementById("newProjectStart").value)||1));
  let b=Math.max(a,Math.min(999,Number(document.getElementById("newProjectEnd").value)||a));
  document.getElementById("newProjectTotal").textContent=`全${b-a+1}P`;
}
document.getElementById("newProjectStart").addEventListener("input",updateNewProjectTotal);
document.getElementById("newProjectEnd").addEventListener("input",updateNewProjectTotal);
document.getElementById("createNewProject").onclick=()=>{
  const title=document.getElementById("newProjectTitle").value.trim()||"無題";
  let a=Math.max(1,Math.min(999,Number(document.getElementById("newProjectStart").value)||1));
  let b=Math.max(a,Math.min(999,Number(document.getElementById("newProjectEnd").value)||a));
  if(b-a+1>300){alert("1作品300ページまでです。");return;}
  const id=newProjectId();
  projectStore.projects[id]=freshProjectData(title,a,b);
  projectStore.activeProjectId=id;
  persistProjectStore();
  document.getElementById("projectModal").classList.remove("open");
  openProject(id);
};

load();
showProjectHome();


// --- Smooth swipe navigation prototype ---
(function(){
  const swipeArea=document.getElementById("pages");
  if(!swipeArea)return;

  let startX=0,startY=0,tracking=false,animating=false;
  const MIN_X=55,MAX_Y=50;

  function changePage(direction){
    if(animating)return;
    const maxView=Math.max(0,Math.ceil(totalPages/12)-1);
    if(direction==="next" && currentView>=maxView)return;
    if(direction==="prev" && currentView<=0)return;

    animating=true;
    const outClass=direction==="next"?"page-slide-out-left":"page-slide-out-right";
    const inClass=direction==="next"?"page-slide-in-from-right":"page-slide-in-from-left";

    swipeArea.classList.remove("page-slide-in-from-right","page-slide-in-from-left");
    swipeArea.classList.add(outClass);

    setTimeout(()=>{
      currentView += direction==="next" ? 1 : -1;
      swipeArea.classList.remove(outClass);
      renderPages();

      // Restart entrance animation cleanly.
      void swipeArea.offsetWidth;
      swipeArea.classList.add(inClass);
      setTimeout(()=>{
        swipeArea.classList.remove(inClass);
        animating=false;
      },230);
    },130);
  }

  swipeArea.addEventListener("touchstart",e=>{
    if(animating || e.touches.length!==1)return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    tracking=true;
  },{passive:true});

  swipeArea.addEventListener("touchend",e=>{
    if(!tracking || !e.changedTouches.length)return;
    tracking=false;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)<MIN_X || Math.abs(dy)>MAX_Y || Math.abs(dx)<=Math.abs(dy))return;
    changePage(dx<0?"next":"prev");
  },{passive:true});
})();
