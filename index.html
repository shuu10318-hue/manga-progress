<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f6f6">
<title>漫画制作進捗</title>
<style>
:root{--bg:#f6f6f6;--card:#fff;--text:#191919;--muted:#777;--border:#ddd;--soft:#e8e8e8;--started:#aaa;--done:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;padding:18px 14px 40px}
h1{margin:0 0 20px;font-size:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:14px}
.label{color:var(--muted);font-size:12px;margin-bottom:7px}
input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:9px;background:white;padding:0 11px;font-size:16px}
.page-buttons{display:flex;gap:7px;flex-wrap:wrap}
button{font:inherit;color:inherit}
.page-button,.nav-button{min-height:42px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:white}
.page-button.active{background:#222;color:white;border-color:#222}
.summary-top,.stage-info,.table-toolbar,.navigation{display:flex;justify-content:space-between;gap:8px}
.summary-top{align-items:flex-end}.summary-title,.section-title{font-weight:700}.section-title{font-size:15px;margin-bottom:12px}
.percentages{margin-top:4px;display:flex;gap:14px;color:var(--muted);font-size:12px}
.complete-pages{font-size:13px;font-weight:700}
.dual-bar{height:11px;background:var(--soft);border-radius:20px;overflow:hidden;position:relative;margin-top:10px}
.started-bar,.done-bar{position:absolute;left:0;top:0;height:100%;border-radius:20px;transition:width .2s}
.started-bar{background:var(--started)}.done-bar{background:var(--done)}
.legend{display:flex;gap:15px;font-size:11px;color:var(--muted);margin-top:8px}
.stage{margin-top:12px}.stage:first-child{margin-top:0}.stage-info{font-size:12px;margin-bottom:5px}.stage-info span:last-child{color:var(--muted)}
.table-head,.page-row{display:grid;grid-template-columns:25px repeat(5,minmax(0,1fr));gap:3px;align-items:center}
.table-head{margin-bottom:5px}.head{color:var(--muted);font-size:9px;line-height:1.15;text-align:center}
.page-number{text-align:center;color:var(--muted);font-size:11px}.page-row{margin-bottom:4px}
.progress-cell{height:39px;padding:0;border:1px solid var(--border);border-radius:6px;background:white;font-size:15px;font-weight:700}
.progress-cell.state1{background:#e5e5e5}.progress-cell.state2{background:#222;color:white;border-color:#222}
.table-toolbar{align-items:center;margin-bottom:10px}.range,.nav-page{color:var(--muted);font-size:12px}
.navigation{align-items:center;margin-top:12px}.nav-button:disabled{opacity:.3}.saved{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.backup-button{min-height:44px;border:1px solid var(--border);border-radius:9px;background:white;font-weight:700}
.backup-note{margin-top:9px;color:var(--muted);font-size:11px;line-height:1.5}
.history-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.history-stat{background:var(--bg);border-radius:9px;padding:10px 6px;text-align:center}
.history-stat b{display:block;font-size:17px;margin-top:3px}
.history-stat span{font-size:10px;color:var(--muted)}
.history-chart{height:130px;display:flex;align-items:flex-end;gap:7px;border-bottom:1px solid var(--border);padding:0 3px;margin-top:8px}
.history-day{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.history-value{font-size:10px;font-weight:700}
.history-bar{width:70%;max-width:28px;background:#222;border-radius:5px 5px 0 0;min-height:2px}
.history-label{font-size:9px;color:var(--muted);height:15px}
.forecast{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:13px;border-top:1px solid var(--border)}
.forecast small{color:var(--muted);display:block;margin-top:3px}
.forecast-date{text-align:right;font-size:17px;font-weight:800}
.page-range{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}.page-range>div{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center}.page-range input{width:100%;box-sizing:border-box}.page-range b{font-size:14px;color:var(--muted)}@media(max-width:360px){.app{padding-left:9px;padding-right:9px}.table-head,.page-row{grid-template-columns:22px repeat(5,minmax(0,1fr));gap:2px}.progress-cell{height:36px}.head{font-size:8px}}

.page-number{cursor:pointer;position:relative;user-select:none}
.page-number.note-marked{font-weight:800}
.note-badge{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px;vertical-align:middle;background:#555}
.sticky-modal{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:flex-end;justify-content:center;z-index:999}
.sticky-modal.open{display:flex}
.sticky-sheet{width:min(520px,100%);background:#fff;border-radius:18px 18px 0 0;padding:18px 14px 24px;box-sizing:border-box}
.sticky-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sticky-head h2{margin:0;font-size:18px}.sticky-close{border:0;background:transparent;font-size:24px}
.sticky-sheet textarea{width:100%;min-height:110px;box-sizing:border-box;border:1px solid var(--border);border-radius:10px;padding:11px;font:inherit}
.color-picks{display:flex;gap:11px;margin:10px 0 16px}
.color-pick{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px #bbb}
.color-pick.selected{border-color:#222;box-shadow:0 0 0 2px #fff,0 0 0 4px #222}
.sticky-save{width:100%;height:44px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:800}
.sticky-actions{display:grid;grid-template-columns:1fr 1.7fr;gap:9px;margin-top:2px}
.sticky-delete{height:44px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#777;font-weight:700}
.sticky-delete:active{background:#f3f3f3}
</style>
</head>
<body>
<div class="app">
<h1>漫画制作進捗</h1>
<div class="card">
<div class="label">作品名</div><input id="title" value="ばちぼこゾンビランド" placeholder="作品名">
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px;margin-bottom:7px">
<div class="label" style="margin:0">制作ページ数</div><div id="totalPageLabel" style="font-size:11px;color:var(--muted)">全48P</div>
</div>
<div class="page-range">
<div><input id="startPageInput" type="number" min="1" max="999" value="1"><span>P</span></div>
<b>〜</b>
<div><input id="endPageInput" type="number" min="1" max="999" value="48"><span>P</span></div>
</div>
</div>
<div class="card">
<div class="summary-top"><div><div class="summary-title">総合進捗</div><div class="percentages"><span>着手 <b id="startedPercent">0%</b></span><span>完成 <b id="donePercent">0%</b></span></div></div><div id="completePages" class="complete-pages">完成 0 / 48P</div></div>
<div class="dual-bar"><div id="mainStarted" class="started-bar"></div><div id="mainDone" class="done-bar"></div></div>
<div class="legend"><span>△ 着手中</span><span>● 完成</span></div>
</div>
<div class="card"><div class="section-title">工程別進捗</div><div id="stageProgress"></div></div>
<div class="card">
<div class="table-toolbar"><div class="section-title" style="margin:0">工程表</div><div id="range" class="range"></div></div>
<div class="table-head"><div></div><div class="head">ネーム</div><div class="head">人物<br>ペン</div><div class="head">背景<br>/3D</div><div class="head">トーン<br>ベタ</div><div class="head">写植</div></div>
<div id="pages"></div>
<div class="navigation"><button id="prev" class="nav-button">← 前</button><div id="navPage" class="nav-page"></div><button id="next" class="nav-button">次 →</button></div>
</div>
<div class="card">
<div class="section-title">作業履歴</div>
<div class="history-stats">
<div class="history-stat"><span>今日</span><b id="todayWork">+0</b><span>完成工程</span></div>
<div class="history-stat"><span>直近7日</span><b id="weekWork">0</b><span>完成工程</span></div>
<div class="history-stat"><span>1日平均</span><b id="avgWork">0.0</b><span>工程</span></div>
</div>
<div class="label">直近7日間</div>
<div id="historyChart" class="history-chart"></div>
<div class="forecast">
<div><b>完成予想</b><small>直近7日のペースから算出</small></div>
<div id="forecastDate" class="forecast-date">—<br><span style="font-size:10px;color:var(--muted);font-weight:400">データ収集中</span></div>
</div>
</div>
<div class="card">
<div class="section-title">バックアップ</div>
<div class="backup-actions">
<button id="exportBackup" class="backup-button">💾 バックアップ</button>
<button id="importBackup" class="backup-button">📂 復元</button>
</div>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<div class="backup-note">作品名・ページ数・全工程の進捗・作業履歴をJSONに保存します。</div>
<div id="backupStatus" style="display:none;margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font-size:12px;line-height:1.55;word-break:break-all"></div>
</div>
<div class="saved" id="saveMessage">変更は自動保存されます</div>
</div>

<div id="stickyModal" class="sticky-modal">
 <div class="sticky-sheet">
  <div class="sticky-head"><h2 id="stickyTitle">付箋</h2><button id="stickyClose" class="sticky-close">×</button></div>
  <textarea id="stickyText" placeholder="修正点・忘れたくないことなど"></textarea>
  <div class="label" style="margin-top:12px">マーカー</div>
  <div class="color-picks">
   <button type="button" class="color-pick" data-color="#f4a6a6" style="background:#f4a6a6"></button>
   <button type="button" class="color-pick" data-color="#f4dc8a" style="background:#f4dc8a"></button>
   <button type="button" class="color-pick" data-color="#9ec8f4" style="background:#9ec8f4"></button>
   <button type="button" class="color-pick" data-color="#a9ddb0" style="background:#a9ddb0"></button>
  </div>
  <div class="sticky-actions">
   <button type="button" id="stickyDelete" class="sticky-delete">付箋を削除</button>
   <button type="button" id="stickySave" class="sticky-save">保存</button>
  </div>
 </div>
</div>

<script>
const STORAGE_KEY="manga-progress-v1";
const stages=["ネーム","人物ペン","背景/3D","トーン・ベタ","写植"];
let totalPages=48,startPage=1,currentView=0,progress=createProgress(48);
let history={day:"",baselineDone:0,days:{}};
let pageNotes={};

function createProgress(n){return Array.from({length:n},()=>Array(5).fill(0))}
function localDate(d=new Date()){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function doneCount(){return progress.flat().filter(v=>v===2).length}
function addDays(dateStr,n){
  const [y,m,d]=dateStr.split("-").map(Number);
  const x=new Date(y,m-1,d); x.setDate(x.getDate()+n); return localDate(x);
}
function normalizeHistory(h){
  const today=localDate();
  if(!h||typeof h!=="object") return {day:today,baselineDone:doneCount(),days:{}};
  return {
    day:typeof h.day==="string"&&h.day?h.day:today,
    baselineDone:Number.isFinite(h.baselineDone)?h.baselineDone:doneCount(),
    days:h.days&&typeof h.days==="object"?h.days:{}
  };
}
function rollHistory(){
  const today=localDate();
  history=normalizeHistory(history);
  if(history.day===today)return;
  // The last known day ends at the current saved state.
  history.days[history.day]=doneCount()-history.baselineDone;
  // Missing calendar days had no recorded changes.
  let d=addDays(history.day,1);
  while(d<today){ if(history.days[d]===undefined)history.days[d]=0; d=addDays(d,1); }
  history.day=today;
  history.baselineDone=doneCount();
}
function todayDelta(){rollHistory();return doneCount()-history.baselineDone}
function save(){
  rollHistory();
  const data={title:document.getElementById("title").value,totalPages,startPage,progress,history,pageNotes};
  localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
  const m=document.getElementById("saveMessage");
  m.textContent="保存しました ✓";
  clearTimeout(save.timer);
  save.timer=setTimeout(()=>m.textContent="変更は自動保存されます",1200);
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(!s){history={day:localDate(),baselineDone:doneCount(),days:{}};return}
    if(s.title)document.getElementById("title").value=s.title;
    if(Number.isInteger(s.totalPages)&&s.totalPages>0)totalPages=s.totalPages;
    if(Number.isInteger(s.startPage)&&s.startPage>0)startPage=s.startPage;
    if(Array.isArray(s.progress))progress=Array.from({length:totalPages},(_,p)=>Array.from({length:5},(_,i)=>[0,1,2].includes(s.progress?.[p]?.[i])?s.progress[p][i]:0));
    pageNotes=(s.pageNotes&&typeof s.pageNotes==="object")?s.pageNotes:{};
    history=normalizeHistory(s.history);
    rollHistory();
  }catch(e){history={day:localDate(),baselineDone:doneCount(),days:{}}}
}
function makeBackup(){
  rollHistory();
  return {app:"manga-progress",version:4,exportedAt:new Date().toISOString(),title:document.getElementById("title").value,totalPages,startPage,progress,history,pageNotes};
}
function safeFileName(name){return (name||"漫画制作進捗").replace(/[\/:*?"<>|]/g,"_").trim()||"漫画制作進捗"}
function showBackupStatus(message){
  const box=document.getElementById("backupStatus");box.style.display="block";box.innerHTML=message;
}
function exportBackup(){
  try{
    const data=makeBackup(),date=localDate();
    const fileName=`${safeFileName(data.title)}_backup_${date}.json`;
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=url;link.download=fileName;link.style.display="none";
    document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    showBackupStatus(`✅ バックアップを保存しました。<br><b>${fileName}</b><br><span style="color:var(--muted)">Chromeのダウンロード一覧または端末の「Downloads」を確認してください。</span>`);
  }catch(err){
    showBackupStatus(`❌ バックアップを保存できませんでした。<br><span style="color:var(--muted)">${String(err.message||err)}</span>`);
  }
}
function restoreBackup(data){
  if(!data||!Number.isInteger(data.totalPages)||data.totalPages<1||data.totalPages>300||!Array.isArray(data.progress))throw new Error("invalid");
  totalPages=data.totalPages;
  startPage=Number.isInteger(data.startPage)&&data.startPage>0?data.startPage:1;
  progress=Array.from({length:totalPages},(_,p)=>Array.from({length:5},(_,i)=>[0,1,2].includes(data.progress?.[p]?.[i])?data.progress[p][i]:0));
  document.getElementById("title").value=typeof data.title==="string"?data.title:"";
  pageNotes=(data.pageNotes&&typeof data.pageNotes==="object")?data.pageNotes:{};
  history=data.history?normalizeHistory(data.history):{day:localDate(),baselineDone:doneCount(),days:{}};
  rollHistory();
  currentView=0;
  syncRangeUI();
  save();render();
}
function resizeProgress(n){
  n=Math.max(1,Math.min(300,Number(n)||48));
  const old=progress;
  progress=Array.from({length:n},(_,p)=>old[p]?[...old[p]]:Array(5).fill(0));
  totalPages=n;currentView=Math.min(currentView,Math.max(0,Math.ceil(n/12)-1));
  save();render();
}
function updateSummary(){
  const f=progress.flat(),st=f.filter(v=>v>0).length,dn=f.filter(v=>v===2).length,t=f.length;
  const sp=Math.round(st/t*100),dp=Math.round(dn/t*100);
  startedPercent.textContent=sp+"%";donePercent.textContent=dp+"%";
  mainStarted.style.width=sp+"%";mainDone.style.width=dp+"%";
  completePages.textContent=`完成 ${progress.filter(r=>r.every(v=>v===2)).length} / ${totalPages}P`;
  renderStages();renderHistory();
}
function renderStages(){
  stageProgress.innerHTML="";
  stages.forEach((name,s)=>{
    const st=progress.filter(r=>r[s]>0).length,dn=progress.filter(r=>r[s]===2).length;
    const sp=Math.round(st/totalPages*100),dp=Math.round(dn/totalPages*100);
    const d=document.createElement("div");d.className="stage";
    d.innerHTML=`<div class="stage-info"><span>${name}</span><span>着手 ${sp}% ・ 完成 ${dp}%</span></div><div class="dual-bar"><div class="started-bar" style="width:${sp}%"></div><div class="done-bar" style="width:${dp}%"></div></div>`;
    stageProgress.appendChild(d);
  });
}
function renderHistory(){
  rollHistory();
  const today=localDate(),values=[];
  for(let i=-6;i<=0;i++){
    const date=addDays(today,i);
    values.push({date,value:date===today?todayDelta():Number(history.days[date]||0)});
  }
  const total=values.reduce((a,x)=>a+x.value,0);
  const avg=total/7;
  const td=todayDelta();
  todayWork.textContent=(td>=0?"+":"")+td;
  weekWork.textContent=total;
  avgWork.textContent=avg.toFixed(1);

  const max=Math.max(1,...values.map(x=>Math.abs(x.value)));
  historyChart.innerHTML="";
  values.forEach((x,i)=>{
    const el=document.createElement("div");el.className="history-day";
    const h=x.value===0?2:Math.max(6,Math.round(Math.abs(x.value)/max*72));
    const label=i===6?"今日":`${Number(x.date.slice(5,7))}/${Number(x.date.slice(8,10))}`;
    el.innerHTML=`<div class="history-value">${x.value>0?"+":""}${x.value}</div><div class="history-bar" style="height:${h}px;${x.value<0?"opacity:.35":""}"></div><div class="history-label">${label}</div>`;
    historyChart.appendChild(el);
  });

  const remaining=totalPages*5-doneCount();
  if(remaining<=0){
    forecastDate.innerHTML=`完成！<br><span style="font-size:10px;color:var(--muted);font-weight:400">全工程完了</span>`;
  }else if(avg>0){
    const days=Math.ceil(remaining/avg),d=new Date();d.setDate(d.getDate()+days);
    forecastDate.innerHTML=`${d.getMonth()+1}/${d.getDate()}<br><span style="font-size:10px;color:var(--muted);font-weight:400">あと約${days}日</span>`;
  }else{
    forecastDate.innerHTML=`—<br><span style="font-size:10px;color:var(--muted);font-weight:400">データ収集中</span>`;
  }
}

let stickyPage=null,stickyColor="";
function openSticky(page){
  stickyPage=page;
  const n=pageNotes[String(page)]||{text:"",color:""};
  stickyColor=n.color||"";
  document.getElementById("stickyTitle").textContent=`${page}P 付箋`;
  document.getElementById("stickyText").value=n.text||"";
  document.querySelectorAll(".color-pick").forEach(b=>b.classList.toggle("selected",b.dataset.color===stickyColor));
  document.getElementById("stickyModal").classList.add("open");
}
document.querySelectorAll(".color-pick").forEach(b=>b.onclick=()=>{
  stickyColor=b.dataset.color||"";
  document.querySelectorAll(".color-pick").forEach(x=>x.classList.toggle("selected",x===b));
});
document.getElementById("stickyClose").onclick=()=>document.getElementById("stickyModal").classList.remove("open");
document.getElementById("stickyModal").onclick=e=>{if(e.target.id==="stickyModal")e.currentTarget.classList.remove("open")};
document.getElementById("stickyDelete").onclick=()=>{
  if(stickyPage===null)return;
  delete pageNotes[String(stickyPage)];
  stickyColor="";
  document.getElementById("stickyText").value="";
  save();
  document.getElementById("stickyModal").classList.remove("open");
  renderPages();
};
document.getElementById("stickySave").onclick=()=>{
  const text=document.getElementById("stickyText").value.trim();
  if(!stickyColor)stickyColor="#f4dc8a";
  pageNotes[String(stickyPage)]={text,color:stickyColor};
  save();
  document.getElementById("stickyModal").classList.remove("open");
  renderPages();
};

function renderPages(){
  pages.innerHTML="";
  const start=currentView*12,end=Math.min(start+12,totalPages);
  for(let p=start;p<end;p++){
    const row=document.createElement("div");row.className="page-row";
    const num=document.createElement("div");num.className="page-number";
    const actualPage=startPage+p, note=pageNotes[String(actualPage)]||{text:"",color:""};
    num.textContent=actualPage;
    if(note.color)num.style.background=note.color;
    num.onclick=()=>openSticky(actualPage);
    row.appendChild(num);
    for(let s=0;s<5;s++){
      const b=document.createElement("button");b.className="progress-cell state"+progress[p][s];
      b.textContent=progress[p][s]===1?"△":progress[p][s]===2?"●":"";
      b.onclick=()=>{progress[p][s]=(progress[p][s]+1)%3;save();renderPages();updateSummary()};
      row.appendChild(b);
    }
    pages.appendChild(row);
  }
  const views=Math.ceil(totalPages/12);
  range.textContent=`${startPage+start}–${startPage+end-1} / 全${totalPages}P`;navPage.textContent=`${currentView+1} / ${views}`;
  prev.disabled=currentView===0;next.disabled=currentView>=views-1;
}
function render(){renderPages();updateSummary()}
prev.onclick=()=>{if(currentView>0){currentView--;renderPages()}};
next.onclick=()=>{if(currentView<Math.ceil(totalPages/12)-1){currentView++;renderPages()}};
function syncRangeUI(){
  startPageInput.value=startPage;
  endPageInput.value=startPage+totalPages-1;
  totalPageLabel.textContent=`全${totalPages}P`;
}
function applyPageRange(){
  const oldStart=startPage;
  let a=Math.max(1,Math.min(999,Number(startPageInput.value)||oldStart));
  let b=Math.max(a,Math.min(999,Number(endPageInput.value)||a));
  const old=progress, oldEnd=oldStart+totalPages-1;
  const newProgress=[];
  for(let page=a;page<=b;page++){
    if(page>=oldStart&&page<=oldEnd) newProgress.push([...old[page-oldStart]]);
    else newProgress.push(Array(5).fill(0));
  }
  startPage=a; totalPages=b-a+1; progress=newProgress; currentView=0;
  syncRangeUI(); save(); render();
}
startPageInput.addEventListener("change",applyPageRange);
endPageInput.addEventListener("change",applyPageRange);
document.getElementById("title").addEventListener("input",save);
document.getElementById("exportBackup").addEventListener("click",exportBackup);
document.getElementById("importBackup").addEventListener("click",()=>document.getElementById("backupFile").click());
document.getElementById("backupFile").addEventListener("change",async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());restoreBackup(data);
    showBackupStatus(`✅ バックアップを復元しました。<br><b>${file.name}</b>`);
  }catch(err){showBackupStatus("❌ このバックアップファイルは読み込めませんでした。")}
  e.target.value="";
});
load();syncRangeUI();save();render();
</script>
</body>
</html>
