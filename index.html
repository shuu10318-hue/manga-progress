<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f6f6">
<title>漫画制作進捗</title>
<style>
:root{--bg:#f6f6f6;--card:#fff;--text:#191919;--muted:#777;--border:#ddd;--soft:#e8e8e8;--started:#aaa;--done:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:520px;margin:auto;padding:18px 14px 40px}
h1{margin:0 0 20px;font-size:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:14px}
.label{color:var(--muted);font-size:12px;margin-bottom:7px}
input{width:100%;min-height:44px;border:1px solid var(--border);border-radius:9px;background:white;padding:0 11px;font-size:16px}
.page-buttons{display:flex;gap:7px;flex-wrap:wrap}
button{font:inherit;color:inherit}
.page-button,.nav-button{min-height:42px;padding:0 14px;border:1px solid var(--border);border-radius:9px;background:white}
.page-button.active{background:#222;color:white;border-color:#222}
.summary-top,.stage-info,.table-toolbar,.navigation{display:flex;justify-content:space-between;gap:8px}
.summary-top{align-items:flex-end}.summary-title,.section-title{font-weight:700}.section-title{font-size:15px;margin-bottom:12px}
.percentages{margin-top:4px;display:flex;gap:14px;color:var(--muted);font-size:12px}
.complete-pages{font-size:13px;font-weight:700}
.dual-bar{height:11px;background:var(--soft);border-radius:20px;overflow:hidden;position:relative;margin-top:10px}
.started-bar,.done-bar{position:absolute;left:0;top:0;height:100%;border-radius:20px;transition:width .2s}
.started-bar{background:var(--started)}.done-bar{background:var(--done)}
.legend{display:flex;gap:15px;font-size:11px;color:var(--muted);margin-top:8px}
.stage{margin-top:12px}.stage:first-child{margin-top:0}.stage-info{font-size:12px;margin-bottom:5px}.stage-info span:last-child{color:var(--muted)}
.table-head,.page-row{display:grid;grid-template-columns:25px repeat(5,minmax(0,1fr));gap:3px;align-items:center}
.table-head{margin-bottom:5px}.head{color:var(--muted);font-size:9px;line-height:1.15;text-align:center}
.page-number{text-align:center;color:var(--muted);font-size:11px}.page-row{margin-bottom:4px}
.progress-cell{height:39px;padding:0;border:1px solid var(--border);border-radius:6px;background:white;font-size:15px;font-weight:700}
.progress-cell.state1{background:#e5e5e5}.progress-cell.state2{background:#222;color:white;border-color:#222}
.table-toolbar{align-items:center;margin-bottom:10px}.range,.nav-page{color:var(--muted);font-size:12px}
.navigation{align-items:center;margin-top:12px}.nav-button:disabled{opacity:.3}.saved{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.backup-button{min-height:44px;border:1px solid var(--border);border-radius:9px;background:white;font-weight:700}
.backup-note{margin-top:9px;color:var(--muted);font-size:11px;line-height:1.5}
@media(max-width:360px){.app{padding-left:9px;padding-right:9px}.table-head,.page-row{grid-template-columns:22px repeat(5,minmax(0,1fr));gap:2px}.progress-cell{height:36px}.head{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<h1>漫画制作進捗</h1>
<div class="card">
<div class="label">作品名</div><input id="title" value="ばちぼこゾンビランド" placeholder="作品名">
<div class="label" style="margin-top:15px">制作ページ数</div>
<div class="page-buttons">
<button class="page-button" data-pages="36">36P</button><button class="page-button active" data-pages="48">48P</button><button class="page-button" data-pages="60">60P</button><button class="page-button" id="customButton">自由</button>
</div>
<div id="customArea" style="display:none;margin-top:10px"><input id="customPages" type="number" min="1" max="300" value="48" placeholder="ページ数"></div>
</div>
<div class="card">
<div class="summary-top"><div><div class="summary-title">総合進捗</div><div class="percentages"><span>着手 <b id="startedPercent">0%</b></span><span>完成 <b id="donePercent">0%</b></span></div></div><div id="completePages" class="complete-pages">完成 0 / 48P</div></div>
<div class="dual-bar"><div id="mainStarted" class="started-bar"></div><div id="mainDone" class="done-bar"></div></div>
<div class="legend"><span>△ 着手中</span><span>● 完成</span></div>
</div>
<div class="card"><div class="section-title">工程別進捗</div><div id="stageProgress"></div></div>
<div class="card">
<div class="table-toolbar"><div class="section-title" style="margin:0">工程表</div><div id="range" class="range"></div></div>
<div class="table-head"><div></div><div class="head">ネーム</div><div class="head">人物<br>ペン</div><div class="head">背景<br>/3D</div><div class="head">トーン<br>ベタ</div><div class="head">写植</div></div>
<div id="pages"></div>
<div class="navigation"><button id="prev" class="nav-button">← 前</button><div id="navPage" class="nav-page"></div><button id="next" class="nav-button">次 →</button></div>
</div>
<div class="card">
<div class="section-title">バックアップ</div>
<div class="backup-actions">
<button id="exportBackup" class="backup-button">💾 バックアップ</button>
<button id="importBackup" class="backup-button">📂 復元</button>
</div>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<div class="backup-note">作品名・ページ数・全工程の進捗をJSONに保存します。</div>
<div id="backupStatus" style="display:none;margin-top:10px;padding:10px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font-size:12px;line-height:1.55;word-break:break-all"></div>
</div>
<div class="saved" id="saveMessage">変更は自動保存されます</div>
</div>
<script>
const STORAGE_KEY="manga-progress-v1";
const stages=["ネーム","人物ペン","背景/3D","トーン・ベタ","写植"];
let totalPages=48,currentView=0,progress=createProgress(48);
function createProgress(n){return Array.from({length:n},()=>Array(5).fill(0))}
function save(){const data={title:document.getElementById("title").value,totalPages,progress};localStorage.setItem(STORAGE_KEY,JSON.stringify(data));const m=document.getElementById("saveMessage");m.textContent="保存しました ✓";clearTimeout(save.timer);save.timer=setTimeout(()=>m.textContent="変更は自動保存されます",1200)}
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!s)return;if(s.title)document.getElementById("title").value=s.title;if(Number.isInteger(s.totalPages)&&s.totalPages>0)totalPages=s.totalPages;if(Array.isArray(s.progress))progress=Array.from({length:totalPages},(_,p)=>Array.from({length:5},(_,i)=>[0,1,2].includes(s.progress?.[p]?.[i])?s.progress[p][i]:0))}catch(e){}}
function makeBackup(){
return {
app:"manga-progress",
version:1,
exportedAt:new Date().toISOString(),
title:document.getElementById("title").value,
totalPages,
progress
}}
function safeFileName(name){
return (name||"漫画制作進捗").replace(/[\\/:*?"<>|]/g,"_").trim()||"漫画制作進捗"
}
function showBackupStatus(message){
const box=document.getElementById("backupStatus");
box.style.display="block";
box.innerHTML=message;
}
async function exportBackup(){
try{
const data=makeBackup();
const date=new Date().toISOString().slice(0,10);
const fileName=`${safeFileName(data.title)}_backup_${date}.json`;
const file=new File([JSON.stringify(data,null,2)],fileName,{type:"application/json"});

/* Android/Chromeでは共有シート経由を優先 */
if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
await navigator.share({
title:"漫画進捗バックアップ",
text:"漫画制作進捗のバックアップです。",
files:[file]
});
showBackupStatus(`✅ バックアップを共有しました。<br><b>${fileName}</b><br><span style="color:var(--muted)">共有先で「Files」「Drive」などを選んで保存してください。</span>`);
return;
}

/* 共有非対応ブラウザでは従来のダウンロードを試す */
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob);
const a=document.createElement("a");
a.href=url;
a.download=fileName;
document.body.appendChild(a);
a.click();
a.remove();
setTimeout(()=>URL.revokeObjectURL(url),3000);
showBackupStatus(`✅ バックアップの保存処理を実行しました。<br><b>${fileName}</b><br><span style="color:var(--muted)">端末の「ダウンロード」フォルダを確認してください。</span>`);
}catch(err){
if(err && err.name==="AbortError"){
showBackupStatus("バックアップ保存をキャンセルしました。");
}else{
showBackupStatus(`❌ バックアップを保存できませんでした。<br><span style="color:var(--muted)">この開き方ではファイル共有が制限されている可能性があります。</span>`);
}
}
}
function restoreBackup(data){
if(!data||!Number.isInteger(data.totalPages)||data.totalPages<1||data.totalPages>300||!Array.isArray(data.progress))throw new Error("invalid");
totalPages=data.totalPages;
progress=Array.from({length:totalPages},(_,p)=>Array.from({length:5},(_,i)=>[0,1,2].includes(data.progress?.[p]?.[i])?data.progress[p][i]:0));
document.getElementById("title").value=typeof data.title==="string"?data.title:"";
currentView=0;
document.querySelectorAll(".page-button").forEach(x=>x.classList.remove("active"));
const preset=document.querySelector(`[data-pages="${totalPages}"]`);
if(preset){preset.classList.add("active");customArea.style.display="none"}else{customButton.classList.add("active");customArea.style.display="block";customPages.value=totalPages}
save();render();
}
function resizeProgress(n){n=Math.max(1,Math.min(300,Number(n)||48));const old=progress;progress=Array.from({length:n},(_,p)=>old[p]?[...old[p]]:Array(5).fill(0));totalPages=n;currentView=Math.min(currentView,Math.max(0,Math.ceil(n/12)-1));save();render()}
function updateSummary(){const f=progress.flat(),st=f.filter(v=>v>0).length,dn=f.filter(v=>v===2).length,t=f.length,sp=Math.round(st/t*100),dp=Math.round(dn/t*100);startedPercent.textContent=sp+"%";donePercent.textContent=dp+"%";mainStarted.style.width=sp+"%";mainDone.style.width=dp+"%";completePages.textContent=`完成 ${progress.filter(r=>r.every(v=>v===2)).length} / ${totalPages}P`;renderStages()}
function renderStages(){stageProgress.innerHTML="";stages.forEach((name,s)=>{const st=progress.filter(r=>r[s]>0).length,dn=progress.filter(r=>r[s]===2).length,sp=Math.round(st/totalPages*100),dp=Math.round(dn/totalPages*100);const d=document.createElement("div");d.className="stage";d.innerHTML=`<div class="stage-info"><span>${name}</span><span>着手 ${sp}% ・ 完成 ${dp}%</span></div><div class="dual-bar"><div class="started-bar" style="width:${sp}%"></div><div class="done-bar" style="width:${dp}%"></div></div>`;stageProgress.appendChild(d)})}
function renderPages(){pages.innerHTML="";const start=currentView*12,end=Math.min(start+12,totalPages);for(let p=start;p<end;p++){const row=document.createElement("div");row.className="page-row";const num=document.createElement("div");num.className="page-number";num.textContent=p+1;row.appendChild(num);for(let s=0;s<5;s++){const b=document.createElement("button");b.className="progress-cell state"+progress[p][s];b.textContent=progress[p][s]===1?"△":progress[p][s]===2?"●":"";b.onclick=()=>{progress[p][s]=(progress[p][s]+1)%3;save();renderPages();updateSummary()};row.appendChild(b)}pages.appendChild(row)}const views=Math.ceil(totalPages/12);range.textContent=`${start+1}–${end} / ${totalPages}P`;navPage.textContent=`${currentView+1} / ${views}`;prev.disabled=currentView===0;next.disabled=currentView>=views-1}
function render(){renderPages();updateSummary()}
prev.onclick=()=>{if(currentView>0){currentView--;renderPages()}};
next.onclick=()=>{if(currentView<Math.ceil(totalPages/12)-1){currentView++;renderPages()}};
document.querySelectorAll("[data-pages]").forEach(b=>b.onclick=()=>{document.querySelectorAll(".page-button").forEach(x=>x.classList.remove("active"));b.classList.add("active");customArea.style.display="none";currentView=0;resizeProgress(b.dataset.pages)});
customButton.onclick=()=>{document.querySelectorAll(".page-button").forEach(x=>x.classList.remove("active"));customButton.classList.add("active");customArea.style.display="block"};
customPages.onchange=e=>{currentView=0;resizeProgress(e.target.value)};
document.getElementById("title").addEventListener("input",save);
document.getElementById("exportBackup").addEventListener("click",exportBackup);
document.getElementById("importBackup").addEventListener("click",()=>document.getElementById("backupFile").click());
document.getElementById("backupFile").addEventListener("change",async e=>{
const file=e.target.files?.[0];
if(!file)return;
try{
const data=JSON.parse(await file.text());
restoreBackup(data);
showBackupStatus(`✅ バックアップを復元しました。<br><b>${file.name}</b>`);
}catch(err){
showBackupStatus("❌ このバックアップファイルは読み込めませんでした。");
}
e.target.value="";
});
load();render();
</script>
</body>
</html>
